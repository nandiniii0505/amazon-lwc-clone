<template>
    <div class="modal-backdrop">
        <div class="auth-card">
            <button class="close-btn" onclick={handleClose}>✕</button>

            <!-- TOGGLE BUTTONS -->
            <div class="auth-tabs">
                <button class={loginTabClass} onclick={showLogin}>Sign In</button>
                <button class={registerTabClass} onclick={showRegister}>Create Account</button>
            </div>

            <!-- LOGIN FORM -->
            <template if:true={isLogin}>
                <form class="auth-form" onsubmit={handleLoginSubmit}>
                    <h3>Sign-In to Amazon</h3>

                    <div class="form-group">
                        <label>Email or Mobile Phone Number</label>
                        <input 
                            type="text" 
                            name="loginId" 
                            value={loginData.loginId} 
                            oninput={handleLoginInput}
                            class={loginErrors.loginIdClass}
                        />
                        <template if:true={loginErrors.loginId}>
                            <span class="error-msg">{loginErrors.loginId}</span>
                        </template>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input 
                            type="password" 
                            name="password" 
                            value={loginData.password} 
                            oninput={handleLoginInput}
                            class={loginErrors.passwordClass}
                        />
                        <template if:true={loginErrors.password}>
                            <span class="error-msg">{loginErrors.password}</span>
                        </template>
                    </div>

                    <button type="submit" class="auth-btn">Continue</button>
                </form>
            </template>

            <!-- REGISTER FORM -->
            <template if:false={isLogin}>
                <form class="auth-form" onsubmit={handleRegisterSubmit}>
                    <h3>Create Account</h3>

                    <div class="form-group">
                        <label>Your Name</label>
                        <input 
                            type="text" 
                            name="name" 
                            value={regData.name} 
                            oninput={handleRegInput}
                            class={regErrors.nameClass}
                        />
                        <template if:true={regErrors.name}>
                            <span class="error-msg">{regErrors.name}</span>
                        </template>
                    </div>

                    <div class="form-group">
                        <label>Mobile Number or Email</label>
                        <input 
                            type="text" 
                            name="contact" 
                            value={regData.contact} 
                            oninput={handleRegInput}
                            class={regErrors.contactClass}
                        />
                        <template if:true={regErrors.contact}>
                            <span class="error-msg">{regErrors.contact}</span>
                        </template>
                    </div>

                    <div class="form-group">
                        <label>Password (at least 6 characters)</label>
                        <input 
                            type="password" 
                            name="password" 
                            value={regData.password} 
                            oninput={handleRegInput}
                            class={regErrors.passwordClass}
                        />
                        <template if:true={regErrors.password}>
                            <span class="error-msg">{regErrors.password}</span>
                        </template>
                    </div>

                    <button type="submit" class="auth-btn">Verify & Register</button>
                </form>
            </template>
        </div>
    </div>
</template>
